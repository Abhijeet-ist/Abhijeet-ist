<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .sans{font-family:'Helvetica Neue',Helvetica,'Inter',Arial,sans-serif}
      .mono{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace}
      .k{fill:#8c8a84;font-size:11px}
      .v{fill:#111110;font-size:12px}
      .ph{fill:#8c8a84;font-size:13px}
    </style>

    <clipPath id="sheet"><rect width="1200" height="430"/></clipPath>

    <!-- $ whoami -->
    <clipPath id="cWho">
      <rect x="40" y="96" height="22" width="63">
        <animate attributeName="width" values="0;63;63;0;0" keyTimes="0;0.04;0.95;0.975;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <!-- name reveal -->
    <clipPath id="cName">
      <rect x="30" y="120" height="310" width="1066">
        <animate attributeName="width" values="0;0;1066;1066;0;0" keyTimes="0;0.0583;0.1583;0.925;0.975;1" calcMode="spline" keySplines="0 0 1 1;.7 0 .25 1;0 0 1 1;.7 0 .3 1;0 0 1 1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <!-- rotating lines -->
    <clipPath id="cP0">
      <rect x="790" y="96" height="22" width="0">
        <animate attributeName="width" values="0;296.4;296.4;0;0" keyTimes="0;0.075;0.2083;0.2417;1" dur="12s" begin="1.8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="cP1">
      <rect x="790" y="96" height="22" width="0">
        <animate attributeName="width" values="0;0;296.4;296.4;0;0" keyTimes="0;0.25;0.325;0.4583;0.4917;1" dur="12s" begin="1.8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="cP2">
      <rect x="790" y="96" height="22" width="0">
        <animate attributeName="width" values="0;0;218.4;218.4;0;0" keyTimes="0;0.5;0.575;0.7083;0.7417;1" dur="12s" begin="1.8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="cP3">
      <rect x="790" y="96" height="22" width="0">
        <animate attributeName="width" values="0;0;304.2;304.2;0;0" keyTimes="0;0.75;0.825;0.9583;0.9917;1" dur="12s" begin="1.8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#sheet)">
    <rect width="1200" height="430" fill="#edebe6"/>

    <!-- index row -->
    <g class="mono">
      <text x="40" y="42" class="k">name</text>
      <text x="40" y="59" class="v">Abhijeet Kumar</text>

      <text x="290" y="42" class="k">role</text>
      <text x="290" y="59" class="v">Code architect</text>

      <text x="540" y="42" class="k">focus</text>
      <text x="540" y="59" class="v">AI, full-stack, systems</text>

      <text x="790" y="42" class="k">based in</text>
      <text x="790" y="59" class="v">Patna, India</text>

      <text x="1160" y="42" class="k" text-anchor="end">github</text>
      <text x="1160" y="59" class="v" text-anchor="end">@abhijeet-ist</text>
    </g>

    <line x1="40" y1="76" x2="1160" y2="76" stroke="#111110" stroke-opacity="0.18"/>

    <!-- prompt -->
    <g clip-path="url(#cWho)">
      <text x="40" y="112" class="mono ph" textLength="62.4" lengthAdjust="spacingAndGlyphs">$ whoami</text>
    </g>

    <!-- rotating lines, aligned to the "based in" column -->
    <g class="mono">
      <g clip-path="url(#cP0)"><text x="790" y="112" class="ph" textLength="296.4" lengthAdjust="spacingAndGlyphs">turning ideas into intelligent systems</text></g>
      <g clip-path="url(#cP1)"><text x="790" y="112" class="ph" textLength="296.4" lengthAdjust="spacingAndGlyphs">building vyana, where empathy meets ai</text></g>
      <g clip-path="url(#cP2)"><text x="790" y="112" class="ph" textLength="218.4" lengthAdjust="spacingAndGlyphs">fine-tuning open-source llms</text></g>
      <g clip-path="url(#cP3)"><text x="790" y="112" class="ph" textLength="304.2" lengthAdjust="spacingAndGlyphs">if life gives you bugs, deploy a hotfix</text></g>
    </g>
    <rect x="792" y="101" width="7" height="14" fill="#8c8a84" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="1.8s" calcMode="discrete" fill="freeze"/>
      <animate attributeName="x" values="792;1088.4;1088.4;792;792;1088.4;1088.4;792;792;1010.4;1010.4;792;792;1096.2;1096.2;792;792" keyTimes="0;0.075;0.2083;0.2417;0.25;0.325;0.4583;0.4917;0.5;0.575;0.7083;0.7417;0.75;0.825;0.9583;0.9917;1" dur="12s" begin="1.8s" repeatCount="indefinite"/>
    </rect>

    <!-- the output -->
    <g clip-path="url(#cName)">
      <text x="34" y="345" class="sans" font-size="280" font-weight="700" letter-spacing="-6" fill="#111110" textLength="1060" lengthAdjust="spacingAndGlyphs">abhijeet</text>
    </g>

    <!-- cursor -->
    <rect x="1110" y="199" width="50" height="146" fill="#ff4f00">
      <animate attributeName="x" values="44;44;1110;1110;44;44" keyTimes="0;0.0583;0.1583;0.925;0.975;1" calcMode="spline" keySplines="0 0 1 1;.7 0 .25 1;0 0 1 1;.7 0 .3 1;0 0 1 1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
