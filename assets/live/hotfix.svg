<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 384" width="1200" height="384">
<style>.s{font-family:'Helvetica Neue',Helvetica,'Inter',Arial,sans-serif}.m{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace}.d{font-family:'Noto Serif Devanagari','Tiro Devanagari Sanskrit','Kohinoor Devanagari','Devanagari Sangam MN',Mangal,serif}.g{fill:#8c8a84}.i{fill:#111110}.p{fill:#edebe6}</style>
<rect width="1200" height="384" fill="#edebe6"/>
<rect x="40" y="35" width="8" height="8" fill="#ff4f00"/>
<text x="58" y="44" class="m" font-size="12"><tspan class="g">15 / </tspan><tspan class="i">bugs vs hotfixes</tspan></text>
<text x="1160" y="44" class="m g" font-size="12" text-anchor="end">read from commit messages</text>
<line x1="40" y1="62" x2="1160" y2="62" stroke="#111110" stroke-opacity=".18"/>
<text x="34" y="176" class="s" font-size="124" font-weight="700" letter-spacing="-5" fill="#ff4f00">31</text>
<text x="40" y="206" class="m i" font-size="13">hotfixes deployed in the last 12 months</text>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.462;1" dur="1.30s" fill="freeze"/><text x="640" y="134" class="s i" font-size="32" font-weight="700" letter-spacing="-1">if life gives you bugs,</text><text x="640" y="174" class="s i" font-size="32" font-weight="700" letter-spacing="-1">deploy a hotfix<tspan fill="#ff4f00">.</tspan></text><text x="642" y="206" class="m g" font-size="12">1 fix for every 1.5 features</text></g>
<clipPath id="seg3"><rect x="40" y="236" width="1120" height="24"><animate attributeName="width" values="0;0;1120.0" keyTimes="0;0.176;1" dur="1.70s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1"/></rect></clipPath><g clip-path="url(#seg3)"><rect x="40.0" y="240" width="22.2" height="16" fill="#ff4f00"/><rect x="62.2" y="240" width="33.7" height="16" fill="#111110"/><rect x="96.0" y="240" width="4.3" height="16" fill="#4a4844"/><rect x="100.3" y="240" width="734.7" height="16" fill="#8c8a84"/><rect x="835.0" y="240" width="51.7" height="16" fill="#b3ada2"/><rect x="886.6" y="240" width="273.4" height="16" fill="#d6d2c9"/></g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.533;1" dur="1.50s" fill="freeze"/><rect x="40" y="288" width="10" height="10" fill="#ff4f00"/><text x="58" y="297" class="m g" font-size="11">fix</text><text x="39" y="332" class="s i" font-size="28" font-weight="700" letter-spacing="-1">31</text><text x="40" y="352" class="m g" font-size="11">2%</text></g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.557;1" dur="1.58s" fill="freeze"/><rect x="226" y="288" width="10" height="10" fill="#111110"/><text x="244" y="297" class="m g" font-size="11">feat</text><text x="225" y="332" class="s i" font-size="28" font-weight="700" letter-spacing="-1">47</text><text x="226" y="352" class="m g" font-size="11">3%</text></g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.578;1" dur="1.66s" fill="freeze"/><rect x="412" y="288" width="10" height="10" fill="#4a4844"/><text x="430" y="297" class="m g" font-size="11">refactor</text><text x="411" y="332" class="s i" font-size="28" font-weight="700" letter-spacing="-1">6</text><text x="412" y="352" class="m g" font-size="11">0%</text></g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.598;1" dur="1.74s" fill="freeze"/><rect x="598" y="288" width="10" height="10" fill="#8c8a84"/><text x="616" y="297" class="m g" font-size="11">chore</text><text x="597" y="332" class="s i" font-size="28" font-weight="700" letter-spacing="-1">1,024</text><text x="598" y="352" class="m g" font-size="11">66%</text></g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.615;1" dur="1.82s" fill="freeze"/><rect x="784" y="288" width="10" height="10" fill="#b3ada2"/><text x="802" y="297" class="m g" font-size="11">docs</text><text x="783" y="332" class="s i" font-size="28" font-weight="700" letter-spacing="-1">72</text><text x="784" y="352" class="m g" font-size="11">5%</text></g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.632;1" dur="1.90s" fill="freeze"/><rect x="970" y="288" width="10" height="10" fill="#d6d2c9"/><text x="988" y="297" class="m g" font-size="11">other</text><text x="969" y="332" class="s i" font-size="28" font-weight="700" letter-spacing="-1">381</text><text x="970" y="352" class="m g" font-size="11">24%</text></g>
</svg>
